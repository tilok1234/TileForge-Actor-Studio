[package]
name = "tileforge-actor-studio"
version = "0.1.0"
description = "A constrained AI sprite workflow for TileForge actors."
authors = ["TileForge Actor Studio contributors"]
edition = "2021"

[lib]
name = "tileforge_actor_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
